[package]
name = "rs-keycloak-http"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
axum.workspace = true
rs-keycloak-authentication = { path = "../authentication" }
rs-keycloak-crypto = { path = "../crypto" }
rs-keycloak-protocols = { path = "../protocols" }
rs-keycloak-integrations = { path = "../integrations" }
rs-keycloak-storage-postgres = { path = "../storage-postgres" }
base64 = "=0.22.1"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
sha2 = "=0.10.9"
tokio.workspace = true
url.workspace = true
uuid = { version = "=1.18.1", features = ["v4"] }
zeroize = "=1.9.1"
percent-encoding = "=2.3.2"

[dev-dependencies]
tower = { version = "=0.5.3", features = ["util"] }
