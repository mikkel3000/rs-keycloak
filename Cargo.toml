[workspace]
members = ["crates/server", "crates/http", "crates/storage-postgres", "crates/crypto"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "Apache-2.0"

[workspace.dependencies]
axum = "=0.8.9"
tokio = { version = "=1.53.3", features = ["macros", "rt-multi-thread", "net", "signal"] }
url = "=2.5.8"
